<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babayshop.id - Price List Jasa Boosting Sosmed</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind Config for Custom Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0f172a', // Slate 900
                        card: '#1e293b', // Slate 800
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom glow effect */
        .glow {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>

<body class="bg-dark text-slate-300 font-sans min-h-screen flex flex-col items-center p-4 sm:p-8 antialiased">
    
    <!-- Background Decoration -->
    <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 pointer-events-none"></div>

    <main class="w-full max-w-5xl relative z-10 flex flex-col gap-8">
        
        <!-- Header & Countdown Section -->
        <header class="bg-card/80 backdrop-blur-md border border-slate-700/50 rounded-2xl p-6 sm:p-10 text-center shadow-xl">
            <h1 class="text-3xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500 mb-4">
                Babayshop.id
            </h1>
            <h2 class="text-xl sm:text-2xl font-semibold text-white mb-6">
                Price List Jasa Boosting Sosmed
            </h2>
            
            <div class="inline-flex flex-col items-center bg-slate-900/50 rounded-xl p-6 border border-indigo-500/30 w-full max-w-md mx-auto">
                <p class="text-slate-400 mb-2">Anda akan otomatis dialihkan ke halaman utama dalam:</p>
                <div class="text-5xl font-bold text-white mb-4 tracking-tight flex items-baseline gap-2">
                    <span id="countdownText" class="text-indigo-400">15</span>
                    <span class="text-lg text-slate-500 font-normal">detik</span>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full bg-slate-700 rounded-full h-1.5 mb-6 overflow-hidden">
                    <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-1.5 rounded-full transition-all duration-1000 ease-linear" style="width: 100%"></div>
                </div>

                <a href="https://babayshop.id" class="w-full inline-flex justify-center items-center py-3 px-6 rounded-lg text-white font-semibold bg-indigo-600 hover:bg-indigo-500 transition-all duration-300 glow group">
                    Menuju Babayshop.id Sekarang
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </a>
            </div>
        </header>

        <!-- Padlet Embed Section -->
        <section class="bg-card border border-slate-700/50 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
            <div class="bg-slate-800/80 p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="text-white font-semibold flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" />
                        <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd" />
                    </svg>
                    Daftar Harga (Preview)
                </h3>
            </div>
            <!-- The Padlet iframe -->
            <div class="w-full h-[600px] md:h-[700px] bg-white">
                <iframe 
                    src="https://padlet.com/embed/eit70b95a2bhl9sg" 
                    frameborder="0" 
                    allow="camera;microphone;geolocation" 
                    class="w-full h-full"
                    title="Price List Jasa Boosting Sosmed Babayshop.id"
                ></iframe>
            </div>
        </section>

        <!-- Footer -->
        <footer class="text-center text-slate-500 text-sm pb-8">
            &copy; 2026 Babayshop.id. All rights reserved.
        </footer>
    </main>

    <!-- JavaScript for Countdown and Redirect -->
    <script>
        const TOTAL_TIME = 15;
        let timeLeft = TOTAL_TIME;
        const targetUrl = "https://babayshop.id";
        
        const countdownElement = document.getElementById('countdownText');
        const progressBarElement = document.getElementById('progressBar');

        const countdownTimer = setInterval(() => {
            timeLeft--;
            
            // Update Text
            countdownElement.textContent = timeLeft;
            
            // Update Progress Bar Width
            const widthPercentage = (timeLeft / TOTAL_TIME) * 100;
            progressBarElement.style.width = `${widthPercentage}%`;

            // When countdown reaches zero
            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                countdownElement.textContent = "0";
                
                // Show brief transition message
                countdownElement.parentElement.innerHTML = '<span class="text-2xl text-indigo-400 animate-pulse">Mengalihkan...</span>';
                
                // Execute redirect
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>
</body>
</html>
