<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="Informasi penutupan sementara Babayshop.id" />
  <title>Babayshop.id — Tutup Sementara</title>
  <link rel="preconnect" href="https://db.onlinewebfonts.com" />
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" />
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" />
  <style>
    :root {
      --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
      --black: #090909;
      --white: #fff;
      --muted: rgba(255,255,255,.68);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: var(--font-body); color: var(--white); background: #080808; }
    button, a { font: inherit; }

    .background-video {
      position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: 70% center;
    }

    .veil {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(circle at 18% 58%, rgba(0,0,0,.08), rgba(0,0,0,.48) 45%, rgba(0,0,0,.72) 100%),
        linear-gradient(90deg, rgba(0,0,0,.74) 0%, rgba(0,0,0,.43) 48%, rgba(0,0,0,.18) 100%);
    }

    .ambient {
      position: fixed; z-index: 1; width: 42vw; height: 42vw; min-width: 360px; min-height: 360px;
      left: -12vw; bottom: -20vw; border-radius: 50%; pointer-events: none;
      background: rgba(255,255,255,.08); filter: blur(95px); mix-blend-mode: screen;
      animation: drift 10s ease-in-out infinite alternate;
    }

    .navbar {
      position: fixed; z-index: 10; top: 0; left: 0; width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px;
    }

    .brand { display: flex; align-items: center; }
    .logo { color: var(--white); font-family: var(--font-heading); font-size: 26px; letter-spacing: -.04em; text-decoration: none; }
    .status-chip { display: inline-flex; align-items: center; gap: 8px; padding: .52em .95em; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; font-size: 14px; color: #fff; background: rgba(0,0,0,.22); backdrop-filter: blur(12px); }
    .status-chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #ff816e; box-shadow: 0 0 0 0 rgba(255,129,110,.55); animation: pulse 2s ease-out infinite; }

    .hero {
      position: relative; z-index: 2; min-height: 100svh; overflow: hidden;
      display: flex; flex-direction: column; justify-content: center;
      padding: 92px 40px 42px;
    }

    .content { position: relative; z-index: 3; max-width: 850px; }
    .eyebrow { margin: 0 0 22px; max-width: 650px; color: rgba(255,255,255,.76); font-size: clamp(18px, 2.2vw, 27px); line-height: 1.3; letter-spacing: -.025em; opacity: 0; transform: translateY(16px); animation: reveal .8s .1s cubic-bezier(.2,.7,.2,1) forwards; }
    h1 { margin: 0 0 26px; max-width: 1000px; font-weight: 400; font-size: clamp(58px, 10vw, 148px); line-height: .82; letter-spacing: -.07em; text-wrap: balance; opacity: 0; transform: translateY(18px); animation: reveal .9s .24s cubic-bezier(.2,.7,.2,1) forwards; }
    h1 strong { color: #fff; font-family: var(--font-heading); font-weight: 700; text-shadow: 0 2px 28px rgba(0,0,0,.28); }

    .message { margin: 0 0 24px; max-width: 720px; color: #fff; font-family: var(--font-heading); font-size: clamp(24px, 3.1vw, 43px); line-height: 1.08; letter-spacing: -.035em; opacity: 0; transform: translateY(16px); animation: reveal .8s .42s cubic-bezier(.2,.7,.2,1) forwards; }

    .note { margin: 0 0 26px; max-width: 680px; color: var(--muted); font-size: clamp(16px, 1.6vw, 20px); line-height: 1.45; opacity: 0; transform: translateY(14px); animation: reveal .8s .58s cubic-bezier(.2,.7,.2,1) forwards; }
    .reason { max-width: 720px; margin: 0; padding: 22px 24px; border: 1px solid rgba(255,255,255,.16); border-radius: 18px; color: rgba(255,255,255,.9); background: linear-gradient(120deg, rgba(255,255,255,.1), rgba(255,255,255,.035)); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 18px 60px rgba(0,0,0,.18); backdrop-filter: blur(14px); font-size: clamp(17px, 1.8vw, 23px); line-height: 1.35; font-style: italic; opacity: 0; transform: translateY(14px); animation: reveal .8s .72s cubic-bezier(.2,.7,.2,1) forwards; }

    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(9vw,-7vh,0) scale(1.16); } }
    @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(255,129,110,0); } 100% { box-shadow: 0 0 0 0 rgba(255,129,110,0); } }

    @media (max-width: 767px) {
      .background-video { object-position: 62% center; }
      .navbar {
        padding: max(14px, env(safe-area-inset-top)) 18px 14px;
        background: linear-gradient(180deg, rgba(5,5,5,.65), rgba(5,5,5,0));
      }
      .brand { min-width: 0; }
      .logo { overflow: hidden; max-width: 160px; font-size: 19px; text-overflow: ellipsis; white-space: nowrap; }
      .status-chip { flex: none; gap: 6px; padding: .48em .72em; font-size: 11px; letter-spacing: .01em; }
      .status-chip::before { width: 6px; height: 6px; }
      .hero {
        min-height: 100dvh; justify-content: flex-end;
        padding: 96px 18px calc(30px + env(safe-area-inset-bottom));
      }
      .content { width: 100%; max-width: 560px; }
      .eyebrow { max-width: 92%; margin-bottom: 14px; font-size: clamp(16px, 4.6vw, 19px); line-height: 1.34; letter-spacing: -.015em; }
      h1 { max-width: 94%; margin-bottom: 18px; font-size: clamp(52px, 16.5vw, 76px); line-height: .87; letter-spacing: -.062em; }
      .message { max-width: 94%; margin-bottom: 16px; font-size: clamp(22px, 6.2vw, 29px); line-height: 1.08; }
      .note { max-width: 96%; margin-bottom: 18px; font-size: clamp(14px, 4vw, 16px); line-height: 1.48; }
      .reason { width: 100%; padding: 16px 17px; border-radius: 15px; font-size: clamp(15px, 4.2vw, 17px); line-height: 1.4; }
      .ambient { width: 90vw; height: 90vw; left: -34vw; bottom: -18vw; filter: blur(72px); }
      .veil { background: linear-gradient(0deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.5) 72%, rgba(0,0,0,.25) 100%); }
    }

    @media (max-width: 380px) {
      .navbar { padding-inline: 14px; }
      .logo { max-width: 138px; font-size: 17px; }
      .hero { padding-inline: 14px; padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
      .eyebrow { font-size: 15px; }
      h1 { font-size: clamp(47px, 15.6vw, 60px); }
      .message { font-size: 21px; }
      .note { font-size: 13.5px; }
      .reason { padding: 14px 15px; font-size: 14px; }
    }

    @media (max-width: 767px) and (max-height: 720px) {
      .hero { justify-content: flex-start; overflow-y: auto; padding-top: 92px; }
      .eyebrow { margin-bottom: 10px; }
      h1 { margin-bottom: 14px; font-size: clamp(46px, 14vw, 62px); }
      .message { margin-bottom: 12px; font-size: clamp(20px, 5.7vw, 25px); }
      .note { margin-bottom: 14px; line-height: 1.4; }
      .reason { padding-block: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
      .ambient, .status-chip::before { animation: none; }
      .eyebrow, h1, .message, .note, .reason { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <!-- ============================================================
       EDIT TEKS DI BAGIAN INI — aman diubah sesuai kebutuhan
       ============================================================ -->
  <script id="site-content" type="application/json">
  {
    "brand": "Babayshop.id",
    "status": "Tutup sementara",
    "label": "Mohon maaf kepada seluruh pelanggan Babayshop.id.\nUntuk sementara waktu.",
    "title": "Tutup Sementara.",
    "reopen": "Estimasi buka kembali: 05 September 2026.",
    "reason": "Admin sedang pekerjaan diluar pulau + Family Time",
    "support": "Admin tetap menerima pesan terkait garansi, komplain, dan bantuan lainnya melalui WhatsApp. Respons kemungkinan jauh lebih lambat. Dimohon pengertiannya"
  }
  </script>

  <video id="bgVideo" class="background-video" muted playsinline preload="auto" aria-hidden="true">
    <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260530_042513_df96a13b-6155-4f6e-8b93-c9dee66fba08.mp4" type="video/mp4" />
  </video>
  <div class="veil"></div>
  <div class="ambient" aria-hidden="true"></div>

  <header class="navbar">
    <div class="brand"><a class="logo" id="brand" href="#"></a></div>
    <span class="status-chip" id="status"></span>
  </header>

  <main class="hero">
    <section class="content" aria-labelledby="page-title">
      <p class="eyebrow" id="label"></p>
      <h1 id="page-title"><strong id="title"></strong></h1>
      <p class="message" id="reopen"></p>
      <p class="note" id="support"></p>
      <p class="reason" id="reason"></p>
    </section>
  </main>

  <script>
    const content = JSON.parse(document.getElementById('site-content').textContent);
    const byId = (id) => document.getElementById(id);
    byId('brand').textContent = content.brand;
    byId('status').textContent = content.status;
    byId('label').innerHTML = content.label.replace(/\n/g, '<br>');
    byId('title').textContent = content.title;
    byId('reopen').textContent = content.reopen;
    byId('support').textContent = content.support;
    byId('reason').textContent = `“${content.reason}”`;
    const video = byId('bgVideo');
    const START_TIME = 1;
    const END_TIME = 4;
    const TRAVEL_MS = 4300;
    const PAUSE_MS = 850;
    let animationFrame;

    const easeInOut = (value) => value < .5
      ? 2 * value * value
      : 1 - Math.pow(-2 * value + 2, 2) / 2;

    function animateVideo(from, to) {
      const startedAt = performance.now();
      function frame(now) {
        const progress = Math.min((now - startedAt) / TRAVEL_MS, 1);
        video.currentTime = from + (to - from) * easeInOut(progress);
        if (progress < 1) {
          animationFrame = requestAnimationFrame(frame);
        } else {
          setTimeout(() => animateVideo(to, from), PAUSE_MS);
        }
      }
      animationFrame = requestAnimationFrame(frame);
    }

    function startVideoLoop() {
      cancelAnimationFrame(animationFrame);
      video.pause();
      const safeEnd = Math.min(END_TIME, Math.max(START_TIME, video.duration - .05));
      video.currentTime = Math.min(START_TIME, safeEnd);
      setTimeout(() => animateVideo(video.currentTime, safeEnd), PAUSE_MS);
    }

    if (video.readyState >= 1) startVideoLoop();
    else video.addEventListener('loadedmetadata', startVideoLoop, { once: true });
  </script>
</body>
</html>
