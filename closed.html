<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="Informasi penutupan sementara Babayshop.id" />
  <title>Babayshop.id — Tutup Sementara</title>
  <link rel="preconnect" href="https://db.onlinewebfonts.com" />
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" />
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" />
  <style>
    :root {
      --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
      --black: #090909;
      --white: #fff;
      --muted: rgba(255,255,255,.68);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: var(--font-body); color: var(--white); background: #080808; }
    button, a { font: inherit; }

    .background-video {
      position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: 70% center;
    }

    .veil {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(circle at 18% 58%, rgba(0,0,0,.08), rgba(0,0,0,.48) 45%, rgba(0,0,0,.72) 100%),
        linear-gradient(90deg, rgba(0,0,0,.74) 0%, rgba(0,0,0,.43) 48%, rgba(0,0,0,.18) 100%);
    }

    .navbar {
      position: fixed; z-index: 10; top: 0; left: 0; width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { color: var(--white); font-family: var(--font-heading); font-size: 26px; letter-spacing: -.04em; text-decoration: none; }
    .asterisk { font-size: 30px; line-height: 1; letter-spacing: -.02em; user-select: none; }
    .status-chip { padding: .52em .95em; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; font-size: 14px; color: #fff; background: rgba(0,0,0,.22); backdrop-filter: blur(12px); }

    .hero {
      position: relative; z-index: 2; min-height: 100svh; overflow: hidden;
      display: flex; flex-direction: column; justify-content: center;
      padding: 92px 40px 42px;
    }

    .content { position: relative; z-index: 3; max-width: 850px; }
    .eyebrow { margin: 0 0 22px; max-width: 560px; color: var(--muted); font-size: clamp(18px, 2.2vw, 27px); line-height: 1.3; letter-spacing: -.025em; }
    h1 { margin: 0 0 26px; max-width: 1000px; font-weight: 400; font-size: clamp(58px, 10vw, 148px); line-height: .82; letter-spacing: -.07em; text-wrap: balance; }
    h1 strong { font-family: var(--font-heading); font-weight: 500; }

    .message { margin: 0 0 24px; max-width: 720px; color: #fff; font-family: var(--font-heading); font-size: clamp(24px, 3.1vw, 43px); line-height: 1.08; letter-spacing: -.035em; }

    .note { margin: 0 0 26px; max-width: 680px; color: var(--muted); font-size: clamp(16px, 1.6vw, 20px); line-height: 1.45; }
    .reason { max-width: 720px; margin: 0; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.88); font-size: clamp(17px, 1.8vw, 23px); line-height: 1.35; font-style: italic; }

    .footer { position: absolute; z-index: 3; right: 32px; bottom: 24px; font-size: 13px; opacity: .65; }

    @media (max-width: 767px) {
      .navbar { padding: 16px 20px; }
      .logo { font-size: 21px; }
      .asterisk { font-size: 25px; }
      .status-chip { font-size: 12px; }
      .hero { justify-content: flex-end; padding: 96px 20px 48px; }
      .eyebrow { margin-bottom: 16px; }
      h1 { margin-bottom: 18px; }
      .message { margin-bottom: 18px; }
      .note { margin-bottom: 18px; }
      .footer { display: none; }
      .veil { background: linear-gradient(0deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.5) 72%, rgba(0,0,0,.25) 100%); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <!-- ============================================================
       EDIT TEKS DI BAGIAN INI — aman diubah sesuai kebutuhan
       ============================================================ -->
  <script id="site-content" type="application/json">
  {
    "brand": "Babayshop.id®",
    "status": "Tutup sementara",
    "label": "Halo, pelanggan Babayshop.id.\nAda kabar singkat dari admin.",
    "title": "Tutup Sementara.",
    "reopen": "Estimasi buka kembali: 17 Agustus 2026.",
    "reason": "Admin sedang perjalanan keluar kota + ada kontrol di rumah sakit... mohon doanya semua...",
    "support": "Admin tetap menerima pesan terkait garansi, komplain, dan bantuan lainnya melalui WhatsApp. Respons kemungkinan jauh lebih lambat sampai admin kembali aktif.",
    "footer": "Gerakkan mouse ke kiri / kanan untuk menggeser video"
  }
  </script>

  <video id="bgVideo" class="background-video" muted playsinline preload="auto" aria-hidden="true">
    <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260530_042513_df96a13b-6155-4f6e-8b93-c9dee66fba08.mp4" type="video/mp4" />
  </video>
  <div class="veil"></div>

  <header class="navbar">
    <div class="brand"><a class="logo" id="brand" href="#"></a><span class="asterisk">✳︎</span></div>
    <span class="status-chip" id="status"></span>
  </header>

  <main class="hero">
    <section class="content" aria-labelledby="page-title">
      <p class="eyebrow" id="label"></p>
      <h1 id="page-title"><strong id="title"></strong></h1>
      <p class="message" id="reopen"></p>
      <p class="note" id="support"></p>
      <p class="reason" id="reason"></p>
    </section>
    <div class="footer" id="footer"></div>
  </main>

  <script>
    const content = JSON.parse(document.getElementById('site-content').textContent);
    const byId = (id) => document.getElementById(id);
    byId('brand').textContent = content.brand;
    byId('status').textContent = content.status;
    byId('label').innerHTML = content.label.replace(/\n/g, '<br>');
    byId('title').textContent = content.title;
    byId('reopen').textContent = content.reopen;
    byId('support').textContent = content.support;
    byId('reason').textContent = `“${content.reason}”`;
    byId('footer').textContent = content.footer;

    const video = byId('bgVideo');
    const sensitivity = 0.8;
    let previousX = null, targetTime = 0, seeking = false;
    function applySeek() {
      if (!Number.isFinite(video.duration) || seeking) return;
      seeking = true;
      video.currentTime = Math.max(0, Math.min(video.duration, targetTime));
    }
    window.addEventListener('mousemove', (event) => {
      if (previousX === null) { previousX = event.clientX; return; }
      if (!Number.isFinite(video.duration)) { previousX = event.clientX; return; }
      const delta = event.clientX - previousX;
      previousX = event.clientX;
      targetTime = Math.max(0, Math.min(video.duration, targetTime + (delta / window.innerWidth) * sensitivity * video.duration));
      applySeek();
    }, { passive: true });
    video.addEventListener('loadedmetadata', () => { targetTime = 0; });
    video.addEventListener('seeked', () => {
      seeking = false;
      if (Math.abs(video.currentTime - targetTime) > .03) applySeek();
    });
  </script>
</body>
</html>
